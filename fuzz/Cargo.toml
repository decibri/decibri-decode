[package]
name = "decibri-decode-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Detaches this package from any workspace above it. `cargo fuzz init` in
# cargo-fuzz 0.13.2 does not write this, and nothing needs it today: the crate
# above is not a workspace and there is no Cargo.toml above that. It is needed
# the moment either changes, and the failure it prevents is every cargo-fuzz
# command refusing to run with "current package believes it's in a workspace
# when it's not".
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.decibri-decode]
path = ".."

# The profile the pre-publish audit's 447 million executions were measured
# under: optimised codegen with the checks that turn a silent wrap or a
# violated internal contract into a catchable panic.
[profile.release]
overflow-checks = true
debug-assertions = true

# One entry per target, and nothing else in `fuzz_targets/` is a target:
# `stream_driver.rs` is a module the four targets that drive a `StreamSource`
# share, and cargo only builds what this table names.

[[bin]]
name = "probe_whole_file"
path = "fuzz_targets/probe_whole_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "probe_streaming"
path = "fuzz_targets/probe_streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wav_streaming"
path = "fuzz_targets/wav_streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aiff_streaming"
path = "fuzz_targets/aiff_streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flac_whole_file"
path = "fuzz_targets/flac_whole_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flac_frames"
path = "fuzz_targets/flac_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flac_stream_info"
path = "fuzz_targets/flac_stream_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flac_recovery"
path = "fuzz_targets/flac_recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "writers"
path = "fuzz_targets/writers.rs"
test = false
doc = false
bench = false
