[package]
name = "decibri-decode"
version = "0.1.2"
edition = "2021"
# Matches the decibri workspace MSRV (workspace.package.rust-version in
# decibri's root Cargo.toml). decibri-decode is consumed by decibri, so it may
# not raise the floor decibri holds.
rust-version = "1.88"
license = "Apache-2.0"
description = "Audio decoding and encoding for WAV, AIFF, FLAC, headerless PCM and G.711 telephony, with automatic file identification."
repository = "https://github.com/decibri/decibri-decode"
documentation = "https://docs.rs/decibri-decode"
readme = "README.md"
keywords = ["audio", "wav", "flac", "aiff", "g711"]
categories = ["multimedia::audio", "multimedia::encoding"]
# CI configuration and agent conventions are repository tooling rather than
# crate content. The consumable documentation, meaning the README, the examples
# and the tests, all ships. CLAUDE.local.md is gitignored so cargo skips it
# regardless; it is listed for intent.
exclude = [".github/", "CLAUDE.md", "CLAUDE.local.md"]

# No [features] section, deliberately. Give this crate bytes and it works out
# what to do with them; a feature flag would mean identical bytes behaving
# differently depending on how the crate was built. Adding a feature later is
# not a breaking change and removing one is, so the cheap position is none.

[dependencies]
# The only dependency this crate has, and the only one it will ever have for
# rate conversion. decibri pins decibri-resampler = "0.4" in
# crates/decibri/Cargo.toml, and this requirement is identical so cargo unifies
# the two into a single tree entry rather than linking two resampler
# implementations into one binary. Always from crates.io and never by path, so
# the requirement stays pinned to what decibri actually ships against.
decibri-resampler = "0.4"
